items:
  - q: "¿Necesito turno previo?"
    r: "Sí, trabajamos con turno previo para garantizarte la atención sin esperas. Podés pedirlo por WhatsApp o desde esta web."
  - q: "¿Atienden a niños?"
    r: "Sí, atendemos pacientes de todas las edades en un ambiente cálido y sin miedo."
  - q: "¿Qué obras sociales aceptan?"
    r: "Aceptamos las principales obras sociales y prepagos. Consultanos por WhatsApp para confirmar la tuya antes del turno."
  - q: "¿Cuánto demora un tratamiento?"
    r: "Depende del caso. En la primera consulta te damos un plan detallado y sin sorpresas."
  - q: "¿Atienden urgencias?"
    r: "Sí, reservamos lugares para urgencias. Escribinos por WhatsApp y te damos prioridad."
